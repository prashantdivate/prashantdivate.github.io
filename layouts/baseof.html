<!doctype html>
<html lang="en" data-theme="{{ .Site.Params.defaultTheme | default "dark" }}" data-motion="on">
<head>{{ partial "head.html" . }}</head>
<body data-page="{{ .Kind }}" data-section="{{ .Section }}">
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
{{ partial "search-dialog.html" . }}
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
