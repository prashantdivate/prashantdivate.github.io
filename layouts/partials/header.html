<header class="site-header">
  <div class="nav-wrap shell">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Home">
      <span class="brand-mark"><span></span></span>
      <span class="brand-text">PD<span>//</span>DEV</span>
    </a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      {{ range site.Menus.main }}
        <a href="{{ .URL | relURL }}" class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="nav-actions">
      <a class="icon-btn" href="{{ site.Params.github }}" target="_blank" rel="noopener" aria-label="GitHub">GH</a>
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button>
    </div>
  </div>
  <nav class="mobile-nav shell" id="mobileNav">
    {{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
  </nav>
</header>
