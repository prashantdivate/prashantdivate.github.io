<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Data.profile.name }}{{ end }}</title>
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta name="author" content="{{ .Site.Params.author }}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#101310">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="alternate" type="application/rss+xml" title="Fieldnotes RSS" href="{{ "index.xml" | relURL }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if eq .Section "posts" }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:image" content="{{ "images/social-card.png" | absURL }}">
<meta name="twitter:card" content="summary_large_image">
{{ if eq .Kind "404" }}<meta name="robots" content="noindex">{{ end }}
<script>
(function () {
  try {
    var theme = localStorage.getItem('fieldnotes-theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    var motion = localStorage.getItem('fieldnotes-motion');
    document.documentElement.dataset.motion = motion === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
  } catch (_) { if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.motion = 'off'; }
})();
</script>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
