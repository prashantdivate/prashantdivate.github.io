# Only Hugo builds this website. GitHub Actions overrides baseURL automatically.
baseURL = 'https://prashantdivate.github.io/'
languageCode = 'en-us'
title = 'Prashant Divate | Fieldnotes'
enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
buildFuture = false

[params]
  description = 'Fieldnotes on embedded Linux, Yocto, containers, and the engineering behind connected devices.'
  author = 'Prashant Divate'
  defaultTheme = 'dark'
  defaultArt = 'linux'

[taxonomies]
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

[markup]
  [markup.highlight]
    style = 'dracula'
    noClasses = false
    lineNos = false
    guessSyntax = false
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5

[caches.images]
  dir = ':cacheDir/images'
